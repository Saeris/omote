approvedGitRepositories:
  - "**"

catalog:
  # Toolchain, shared with the taproom.social repo so both check and test alike.
  vite: "npm:@voidzero-dev/vite-plus-core@^0.3.2"
  vite-plus: ^0.3.2
  vitest: ^4.1.11
  # Schemas are the type source of truth: the lexicons' Valibot twins, form
  # validation in the editor, and parsing whatever a PDS hands back.
  valibot: ^1.4.2
  # The editor's forms and server state.
  react-hook-form: ^7.81.0
  "@hookform/resolvers": ^5.4.0
  "@tanstack/react-query": ^5.101.2
  "react-aria-components": ^1.21.1
  # The hooks under react-aria-components, for the image cropper's useMove.
  # Keep it on the version react-aria-components pins.
  "react-aria": 3.52.1
  # ATProto, via atcute rather than the official packages: a fraction of the
  # weight in a browser, and the same choice the taproom apps made.
  "@atcute/client": ^5.1.2
  "@atcute/oauth-browser-client": ^5.0.2
  "@atcute/atproto": ^4.0.4
  "@atcute/identity-resolver": ^2.0.2
  # identity-resolver's peer, so every consumer of @omote-social/profiles gets it.
  "@atcute/identity": ^2.0.2
  "@atcute/lexicons": ^2.1.0
  # The editor reads each app's published lexicon to learn what its profile
  # record accepts, and the resolver verifies the record it fetches.
  "@atcute/lexicon-resolver": ^1.0.1
  "@atcute/lexicon-doc": ^3.0.1
  # The site: static Astro pages with React only where a form needs it, served
  # from a Worker's static assets beside the resolve API.
  astro: ^7.3.2
  "@astrojs/react": ^6.0.5
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  wrangler: ^4.136.1
  # Tests mock the network at the fetch boundary, so the code under test is the
  # code that ships, not a version with its HTTP swapped out.
  msw: ^2.15.0

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.0.cjs
